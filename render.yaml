services:
  - type: web
    name: livepoll-backend
    env: go
    rootDir: backend
    buildCommand: go build -o main .
    startCommand: ./main
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: livepoll
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: FRONTEND_URL
        sync: false
