
services:
  redis:
    image: redis:7-alpine
    container_name: livepoll_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - livepoll_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: livepoll_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"
    depends_on:
      - redis
    networks:
      - livepoll_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livepoll_frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - backend
    networks:
      - livepoll_net

networks:
  livepoll_net:
    driver: bridge
